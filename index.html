<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>랜덤 스팀 게임</title>
  <script>
    // 스팀에서 실제 존재하는 게임 앱 ID 예시 (몇 개만 샘플로 작성, 더 추가 가능)
    const appIds = [
      730,    // Counter-Strike 2
      570,    // Dota 2
      440,    // Team Fortress 2
      271590, // GTA V
      1174180,// Red Dead Redemption 2
      578080, // PUBG
      1091500,// Cyberpunk 2077
      292030, // Witcher 3
      359550, // Rainbow Six Siege
      1245620 // Baldur's Gate 3
    ];

    function goToRandomSteamGame() {
      const randomIndex = Math.floor(Math.random() * appIds.length);
      const appId = appIds[randomIndex];
      const url = `https://store.steampowered.com/app/${appId}`;
      window.location.href = url;
    }
  </script>
</head>
<body>
  <h1>랜덤 스팀 게임 상점 페이지로 이동</h1>
  <button onclick="goToRandomSteamGame()">게임 보러 가기!</button>
</body>
</html>
